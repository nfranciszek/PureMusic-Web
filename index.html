
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/jpeg"
      href="/PureMusicLogo.jpeg"
      sizes="64x64"
    />

    <!-- Primary SEO -->
    <title>
      PureMusic | Private Grand Piano Experiences
    </title>

    <meta
      name="description"
      content="PureMusic offers private, beginner-friendly grand piano experiences through hotel and resort partnerships and individual collaborations. Play your favorite song alongside a professional pianist and receive a video to share."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="theme-color"
      content="#06e4ed"
    />

    <!-- Open Graph: Social Media Sharing -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="PureMusic | Your Favorite Song. Your Moment at the Piano."
    />

    <meta
      property="og:description"
      content="Play your favorite song alongside a professional pianist on a grand piano. No experience necessary. Create a musical memory and receive a video to share."
    />

    <meta
      property="og:image"
      content="/PureMusicLogo.jpeg"
    />

    <meta
      property="og:site_name"
      content="PureMusic"
    />

    <!-- Twitter / X Sharing -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="PureMusic | Private Grand Piano Experiences"
    />

    <meta
      name="twitter:description"
      content="Your favorite song. Your moment at the piano. Experience a private grand piano duet with a professional pianist."
    />

    <!-- Stripe -->
    <script src="https://js.stripe.com/v3/"></script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
